<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jharkhand Innovation Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Jharkhand Societal Challenge Platform</h1>
        <p>Connecting Citizens, Universities, and Industries for Real Solutions</p>
    </header>

    <div class="container">
        <!-- Left Side: Form -->
        <section id="submission-form">
            <h2>Submit a Societal Challenge</h2>
            <form id="challengeForm">
                <label>Challenge Title</label>
                <input type="text" id="title" name="title" required>

                <label>Category</label>
                <select id="category" name="category" required>
                    <option value="">-- Select Category --</option>
                    <option value="Agriculture">Agriculture</option>
                    <option value="Water">Water Management</option>
                    <option value="Sanitation">Sanitation</option>
                    <option value="Disaster">Disaster Management</option>
                    <option value="Education">Education</option>
                    <option value="Healthcare">Healthcare</option>
                    <option value="Urban">Urban Infrastructure</option>
                </select>

                <label>Detailed Description</label>
                <textarea id="description" name="description" rows="4" required></textarea>

                <label>Location</label>
                <div class="location-input">
                    <input type="text" id="location" name="location" placeholder="Enter address or use GPS" required>
                    <button type="button" id="gpsBtn">📡 GPS</button>
                </div>

                <label class="urgent-checkbox">
                    <input type="checkbox" id="urgent" name="urgent"> 
                    <span>🚨 Mark as URGENT (Disaster / Life threatening)</span>
                </label>

                <label>Upload Evidence (Photo / Video)</label>
                <input type="file" id="attachment" name="attachment" accept="image/*,video/*">

                <button type="submit">Submit Challenge</button>
            </form>
        </section>

        <!-- Right Side: Challenge Display -->
        <section id="challenges-list">
            <h2>Active Challenges & Assignments</h2>
            <div id="challengeCards"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
